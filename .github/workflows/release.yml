name: Build & Publish Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Stamp CI versionName
        run: |
          sed -i "s/versionName = \".*\"/versionName = \"5.1.${{ github.run_number }}\"/" app/build.gradle.kts
          sed -i "s/versionCode = [0-9]*/versionCode = $((10 + ${{ github.run_number }}))/" app/build.gradle.kts

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Stage APK artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "HolosReader-v5.1.${{ github.run_number }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.1.${{ github.run_number }}
          name: HolosReader v5.1.${{ github.run_number }}
          body: |
            Automated build from commit ${{ github.sha }}.
            Install or update directly inside HolosReader without logging into GitHub.
          make_latest: true
          files: HolosReader-v5.1.${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
