name: Build & Publish Release APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".editorconfig"
      - ".gitattributes"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Stamp CI versionName
        run: |
          sed -i "s/versionName = \".*\"/versionName = \"5.1.${{ github.run_number }}\"/" app/build.gradle.kts
          sed -i "s/versionCode = [0-9]*/versionCode = $((10 + ${{ github.run_number }}))/" app/build.gradle.kts

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Stage APK and SHA256SUMS
        id: stage
        run: |
          APK="HolosReader-v5.1.${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          sha256sum "$APK" > SHA256SUMS
          APK_SHA=$(awk '{print $1}' SHA256SUMS)
          APK_SIZE=$(stat -c%s "$APK" | sed ':a;s/\B[0-9]\{3\}\>/,&/;ta')
          SUM_SIZE=$(stat -c%s SHA256SUMS)
          {
            echo "apk_name=$APK"
            echo "apk_sha=$APK_SHA"
            echo "apk_size=$APK_SIZE"
            echo "sum_size=$SUM_SIZE"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.1.${{ github.run_number }}
          name: HolosReader v5.1.${{ github.run_number }}
          body: |
            > [!NOTE]
            > Automated build from commit `${{ github.sha }}`. Requires Android 10+ (API 29–35). APKs are debug-signed for consistent zero-login in-app updates; verify downloads against `SHA256SUMS`.

            ## Downloads & Checksums

            | File | Platform | Size | SHA-256 |
            |---|---|---:|---|
            | `${{ steps.stage.outputs.apk_name }}` | Android 10+ (API 29–35, Universal) | ${{ steps.stage.outputs.apk_size }} B | `${{ steps.stage.outputs.apk_sha }}` |
            | `SHA256SUMS` | All | ${{ steps.stage.outputs.sum_size }} B | Checksum list for release artifacts |

            **Full Changelog:** https://github.com/${{ github.repository }}/commits/v5.1.${{ github.run_number }}
          make_latest: true
          files: |
            HolosReader-v5.1.${{ github.run_number }}.apk
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
