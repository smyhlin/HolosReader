name: Build & Publish Release APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".editorconfig"
      - ".gitattributes"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Stamp CI versionName
        run: |
          sed -i "s/versionName = \".*\"/versionName = \"5.1.${{ github.run_number }}\"/" app/build.gradle.kts
          sed -i "s/versionCode = [0-9]*/versionCode = $((10 + ${{ github.run_number }}))/" app/build.gradle.kts

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build Signed Release APKs (R8 + ABI Splits)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/holos-release.jks
          KEYSTORE_FILE=/tmp/holos-release.jks ./gradlew :app:assembleRelease -PenableAbiSplits=true
          rm -f /tmp/holos-release.jks

      - name: Stage APKs and SHA256SUMS
        id: stage
        run: |
          VER="5.1.${{ github.run_number }}"
          ARM64_APK="HolosReader-v${VER}-arm64-v8a.apk"
          UNIV_APK="HolosReader-v${VER}-universal.apk"
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "$ARM64_APK"
          cp app/build/outputs/apk/release/app-universal-release.apk "$UNIV_APK"
          sha256sum "$ARM64_APK" "$UNIV_APK" > SHA256SUMS
          ARM64_SHA=$(awk -v f="$ARM64_APK" '$2==f {print $1}' SHA256SUMS)
          UNIV_SHA=$(awk -v f="$UNIV_APK" '$2==f {print $1}' SHA256SUMS)
          ARM64_SIZE=$(stat -c%s "$ARM64_APK" | sed ':a;s/\B[0-9]\{3\}\>/,&/;ta')
          UNIV_SIZE=$(stat -c%s "$UNIV_APK" | sed ':a;s/\B[0-9]\{3\}\>/,&/;ta')
          SUM_SIZE=$(stat -c%s SHA256SUMS)
          {
            echo "arm64_name=$ARM64_APK"
            echo "arm64_sha=$ARM64_SHA"
            echo "arm64_size=$ARM64_SIZE"
            echo "univ_name=$UNIV_APK"
            echo "univ_sha=$UNIV_SHA"
            echo "univ_size=$UNIV_SIZE"
            echo "sum_size=$SUM_SIZE"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.1.${{ github.run_number }}
          name: HolosReader v5.1.${{ github.run_number }}
          body: |
            > [!NOTE]
            > Automated R8-minified, consistently signed release from commit `${{ github.sha }}`. Requires Android 10+ (API 29–35). Most modern Android phones should install **`arm64-v8a`** (smaller download); use **`universal`** for other ABIs. Verify downloads against `SHA256SUMS`.

            ## Downloads & Checksums

            | File | Platform | Size | SHA-256 |
            |---|---|---:|---|
            | `${{ steps.stage.outputs.arm64_name }}` | Android 10+ (`arm64-v8a`, recommended) | ${{ steps.stage.outputs.arm64_size }} B | `${{ steps.stage.outputs.arm64_sha }}` |
            | `${{ steps.stage.outputs.univ_name }}` | Android 10+ (Universal) | ${{ steps.stage.outputs.univ_size }} B | `${{ steps.stage.outputs.univ_sha }}` |
            | `SHA256SUMS` | All | ${{ steps.stage.outputs.sum_size }} B | Checksum list for release artifacts |

            **Full Changelog:** https://github.com/${{ github.repository }}/commits/v5.1.${{ github.run_number }}
          make_latest: true
          files: |
            HolosReader-v5.1.${{ github.run_number }}-arm64-v8a.apk
            HolosReader-v5.1.${{ github.run_number }}-universal.apk
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
