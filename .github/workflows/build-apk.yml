name: Build HolosReader APK

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify Python Exporter Syntax
        run: python3 -m py_compile tools/*.py

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Unit Tests & Android Lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug

      - name: Upload Android Lint Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Verify Unsigned/Debug-Signed Release Smoke Build (Fork/PR)
        if: github.event_name == 'pull_request'
        run: ./gradlew :app:assembleRelease -PenableAbiSplits=true

      - name: Verify Signed Release Build (R8 + ABI Splits)
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing on protected build — failing closed." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/holos-release.jks
          export KEYSTORE_FILE=/tmp/holos-release.jks
          ./gradlew :app:assembleRelease -PenableAbiSplits=true -PrequireReleaseSigning=true
          rm -f /tmp/holos-release.jks

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: HolosReader-EPUB3-HolosTTS-apk
          path: app/build/outputs/apk/debug/app-debug.apk
