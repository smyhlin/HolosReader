name: Build HolosReader APK

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests & Android Lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Verify Signed Release Build (R8 + ABI Splits)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/holos-release.jks
            export KEYSTORE_FILE=/tmp/holos-release.jks
          fi
          ./gradlew :app:assembleRelease -PenableAbiSplits=true
          rm -f /tmp/holos-release.jks

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HolosReader-EPUB3-HolosTTS-apk
          path: app/build/outputs/apk/debug/app-debug.apk
